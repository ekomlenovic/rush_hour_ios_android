name: Server

# Multiplayer server (#46): tests on the pull requests, Docker image on GHCR
# (:multi from the multi branch, :preprod from the version branches X.Y.Z,
# :latest from main)
on:
  pull_request:
    paths:
      - 'server/**'
      - 'utils/**'
      - 'store/types.ts'
      - 'store/levelIds.ts'
      - 'theme/**'
      - 'data/sampleLevels.ts'
      - 'data/campaignPack.ts'
      - 'data/levelCodec.ts'
      - '.dockerignore'
      - '.github/workflows/server.yml'
  push:
    branches: [main, multi, '[0-9]+.[0-9]+.[0-9]+']
    paths:
      - 'server/**'
      - 'utils/**'
      - 'store/types.ts'
      - 'store/levelIds.ts'
      - 'theme/**'
      - 'data/sampleLevels.ts'
      - 'data/campaignPack.ts'
      - 'data/levelCodec.ts'
      - '.dockerignore'
      - '.github/workflows/server.yml'
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  image:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: |
          case "${{ github.ref }}" in
            refs/heads/main) echo "tag=latest" >> "$GITHUB_OUTPUT"; echo "push=true" >> "$GITHUB_OUTPUT" ;;
            refs/heads/multi) echo "tag=multi" >> "$GITHUB_OUTPUT"; echo "push=true" >> "$GITHUB_OUTPUT" ;;
            refs/heads/[0-9]*.[0-9]*.[0-9]*) echo "tag=preprod" >> "$GITHUB_OUTPUT"; echo "push=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=test" >> "$GITHUB_OUTPUT"; echo "push=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: steps.tag.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: ${{ steps.tag.outputs.push == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rush-hours-server:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/rush-hours-server:${{ steps.tag.outputs.tag }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Rush Hours multiplayer server
          cache-from: type=gha
          cache-to: type=gha,mode=max
