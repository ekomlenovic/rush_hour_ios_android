name: Build iOS & Android (Unsigned)

# Manual only (Actions > Run workflow): builds, publishes a release and updates the
# update sources. Pull requests and pushes only run the tests (tests.yml).
on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android APK?'
        required: false
        type: boolean
        default: false
      create_release:
        description: 'Publish the release and update sources even outside main?'
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    name: Prepare Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: read-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-ios:
    name: Build iOS
    needs: prepare
    # Expo SDK 57 needs Xcode 26 (expo-modules-jsi is a swift-tools-version 6.2 package)
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate native iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --clean
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build iOS unsigned archive (xcodebuild)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace RushHours.xcworkspace \
            -scheme RushHours \
            -configuration Release \
            -archivePath ../build/RushHours.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            -allowProvisioningUpdates \
            | xcbeautify

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/RushHours.xcarchive/Products/Applications/RushHours.app build/ipa/Payload/
          cd build/ipa
          zip -r ../../rush-hours-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: rush-hours-unsigned.ipa

  build-android:
    name: Build Android
    needs: prepare
    if: github.event.inputs.build_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: android/app/build/outputs/apk/release/app-release.apk

  release:
    name: Create Release
    # Waits for Android so the APK is in the release; Android skipped is fine, failed is not
    needs: [prepare, build-ios, build-android]
    # A run on another branch only builds, unless create_release is checked
    if: >-
      always()
      && needs.build-ios.result == 'success'
      && (needs.build-android.result == 'success' || needs.build-android.result == 'skipped')
      && (github.ref == 'refs/heads/main' || inputs.create_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ISO Build
        uses: actions/download-artifact@v4
        with:
          name: ios-build

      - name: Download Android Build (Optional)
        uses: actions/download-artifact@v4
        with:
          name: android-build
        continue-on-error: true

      - name: Rename binaries
        run: |
          if [ -f "app-release.apk" ]; then
            mv app-release.apk rush-hours.apk
            echo "HAS_APK=true" >> $GITHUB_ENV
          else
            echo "HAS_APK=false" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}-b${{ github.run_number }}
          # Tag the built commit, not the default branch head
          target_commitish: ${{ github.sha }}
          name: Rush Hours v${{ needs.prepare.outputs.version }} (Build ${{ github.run_number }})
          body: |
            ## Release v${{ needs.prepare.outputs.version }}
            
            Multi-platform build from `${{ github.sha }}`.

            ### iOS (IPA Non-Signé)
            À installer via SideStore / AltStore.
            
            ### Android (APK)
            Installation directe.
          files: |
            rush-hours-unsigned.ipa
            rush-hours.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Update Sources & Push Changes
        run: |
          IPA_SIZE=$(stat -c%s rush-hours-unsigned.ipa)

          VERSION="${{ needs.prepare.outputs.version }}"
          TAG_NAME="v${VERSION}-b${{ github.run_number }}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}"
          IPA_URL="${BASE_URL}/rush-hours-unsigned.ipa"
          DATE=$(date +'%Y-%m-%d')
          
          node -e "
            const fs = require('fs');
            
            // Update sidestore-source.json (iOS)
            const iosSource = JSON.parse(fs.readFileSync('sidestore-source.json', 'utf8'));
            const iosApp = iosSource.apps[0];
            iosApp.version = '${VERSION}';
            iosApp.buildVersion = '${{ github.run_number }}';
            iosApp.versionDate = '${DATE}';
            iosApp.downloadURL = '${IPA_URL}';
            iosApp.size = parseInt('${IPA_SIZE}');
            fs.writeFileSync('sidestore-source.json', JSON.stringify(iosSource, null, 2));
            
            // android-source.json is NOT updated here: Android users update through
            // Google Play, so it must only announce the version live on the Play Store
            // (edited by hand when Google accepts a release, see docs/PLAY_STORE.md).
          "
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sidestore-source.json
          git diff --cached --quiet || git commit -m "chore: update update sources for ${VERSION} [skip ci]"
          # The branch may have moved since the build started (a merge, or a re-run, which
          # checks out the original commit): replay the sources commit on its current head.
          # On a conflict (another sources commit), this build's values win.
          git pull --rebase -X theirs origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
