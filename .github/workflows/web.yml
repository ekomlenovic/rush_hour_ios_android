name: Web

# Web version / PWA (see docs/GAME_DESIGN.md, Version web): built on each pull request (a change
# that breaks the web shows there), published on GitHub Pages from main and from the version
# branches X.Y.Z (to try a version before main), at https://ekomlenovic.github.io/rush_hour_ios_android/
# One site: the last branch published wins. A manual run publishes its branch.
# Once in the repository settings: Pages → Source: GitHub Actions, and Environments → github-pages →
# Deployment branches: main and the version branches (rule [0-9]*.[0-9]*.[0-9]*).
on:
  pull_request:
  push:
    branches: [main, '[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --legacy-peer-deps

      # Not Google Play: the donation link may show (see docs/GAME_DESIGN.md, Dons)
      - run: npm run build:web
        env:
          EXPO_PUBLIC_DONATION_LINK: '1'

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
