<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: the safe areas of the iPhone (notch, home bar) reach the app as env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Installed on the home screen (PWA): full screen, its own icon and name. Paths: experiments.baseUrl of app.json -->
    <link rel="manifest" href="/rush_hour_ios_android/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/rush_hour_ios_android/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rush Hours" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F5FA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F0F1A" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* A game, not a page: no bounce, no double-tap zoom, no text selected or callout while dragging a vehicle */
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        background-color: #F5F5FA;
      }
      /* The ring of the focused element for the keyboard only, not after a touch or a focus set by the app */
      :focus:not(:focus-visible) {
        outline: none;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0F0F1A;
        }
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Rush Hours needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script>
      // Offline play and a fast start: the service worker written at the export (scripts/web/postExport.mjs)
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/rush_hour_ios_android/sw.js', { scope: '/rush_hour_ios_android/' }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
