<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:Inter,sans-serif;color:#fff;position:relative;
 background:radial-gradient(120% 70% at 50% 0%,#5B50E0 0%,#3A2FB8 38%,#1A2B4C 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.05) 2px,transparent 2px);background-size:90px 90px;background-position:-2px -2px;
 -webkit-mask-image:linear-gradient(#000 0%,transparent 45%);}
.blk{position:absolute;border-radius:22px;opacity:.16}
header{position:absolute;top:110px;left:70px;right:70px;text-align:center}
h1{font-weight:900;font-size:84px;line-height:1.04;letter-spacing:-2px}
h1 em{font-style:normal;color:#FFC93C}
p{margin-top:28px;font-size:38px;line-height:1.3;font-weight:500;color:rgba(255,255,255,.82)}
.phone{position:absolute;background:#0B1020;border-radius:78px;padding:20px;box-shadow:0 40px 90px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.12)}
.phone img{display:block;width:100%;border-radius:60px}
.single{left:50%;width:820px;transform:translateX(-50%);top:var(--top,520px)}
.tablet .phone{border-radius:56px;padding:26px}
.tablet .phone img{border-radius:32px}
.tablet .single{width:900px}
.duoA{width:540px;left:-10px;top:560px;transform:rotate(-5deg)}
.duoB{width:540px;right:-10px;top:640px;transform:rotate(5deg);z-index:2}
</style></head><body>
<div class="grid"></div>
<header><h1 id="h"></h1><p id="s"></p></header>
<div id="phones"></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('h').innerHTML=q.get('h');document.getElementById('s').innerHTML=q.get('s');
const h=document.getElementById('h');let fs=84;while(h.getBoundingClientRect().height>fs*1.04*2+4&&fs>50){fs-=2;h.style.fontSize=fs+'px';}
const imgs=q.get('img').split('|');const ph=document.getElementById('phones');
if(q.get('device')==='tablet')document.body.classList.add('tablet');
if(q.get('top'))document.body.style.setProperty('--top',q.get('top')+'px');
imgs.forEach((src,i)=>{const d=document.createElement('div');d.className='phone '+(imgs.length===1?'single':(i?'duoB':'duoA'));d.innerHTML='<img src="'+src+'">';ph.appendChild(d)});
</script></body></html>
